modelVersion: 4.0.0

groupId: io.github.jam01
artifactId: json-schema-aggregator
version: 0
packaging: pom

modules:
  - jvm
  - src/build/sjsld # build-time only, must precede js (consumed by `js` test phase and `npm` link)
  - js
  - npm

properties:
  maven.deploy.skip: 'true' # need not deploy aggregator

build:
  plugins:
    - id: com.mycila:license-maven-plugin:4.5 # update licenses with: mvn license:format -pl '.'
      executions:
        - id: license-headers
          goals: ['check'] # on verify
      configuration:
        licenseSets:
          - header: '${project.basedir}/src/build/license-header.txt'
            excludes:
              - '.mvn/**'
              - 'src/build/license-header.txt'
              - 'src/build/yq-assign.sh'
              - 'src/build/pom.yaml'
              - '**/NOTICE'
              - '**/LICENSE'
              - '**/*pom.*'
              - README.md
              - AGENTS.md
              - npm/README.md
              - npm/**/*.d.ts
              - npm/**/*.json
              - docs/**
              - theme/**
              - mkdocs.yml
              - '**/target/**'
              - '**/src/test/resources/**'
