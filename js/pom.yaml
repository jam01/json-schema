modelVersion: 4.0.0

parent:
  groupId: io.github.jam01
  artifactId: json-schema-parent
  # https://issues.apache.org/jira/browse/MNG-6656
  version: 0.1.1-SNAPSHOT
  relativePath: ../src/build/pom.yaml

groupId: io.github.jam01
artifactId: json-schema_sjs1_3
packaging: jar

name: JSON Schema Validator for Scala.js

dependencies:
  - org.scala-lang:scala3-library_sjs1_3:3.3.3
  - com.lihaoyi:upickle-core_sjs1_3:3.3.1
  - io.github.cquiroz:scala-java-time_sjs1_3:2.6.0
  # test
  - org.scala-js:scalajs-test-bridge_2.13:test:1.12.0 # match scala3-lib_sjs1_3
  - com.lihaoyi:ujson_sjs1_3:test:3.3.1
  - org.junit.jupiter:junit-jupiter:test:5.10.2
  - org.junit.jupiter:junit-jupiter-params:test:5.10.2
  - org.skyscreamer:jsonassert:test:1.5.1

build:
  plugins:
    - id: org.apache.maven.plugins:maven-compiler-plugin:3.11.0
      configuration:
        skipMain: 'true'
        skip: 'true'
    - id: net.alchim31.maven:scala-maven-plugin:4.9.1
      executions:
        - goals: [compile, testCompile]
          configuration:
            args: ['-deprecation', '-feature', '-scalajs']
    # parent adds shared/src/test/scala as a test source — those tests use JVM-only APIs
    # (filesystem, JUnit 5) and cannot link on Scala.js; disable just that execution.
    - id: org.codehaus.mojo:build-helper-maven-plugin:3.6.0
      executions:
        - id: shared-test-sources
          phase: none
    # Dump the test runtime classpath for sjsld to scan for .sjsir.
    - id: org.apache.maven.plugins:maven-dependency-plugin:3.6.1
      executions:
        - id: dump-test-classpath
          phase: test-compile
          goals: ['build-classpath']
          configuration:
            outputFile: ${project.build.directory}/test-classpath.txt
            includeScope: test
    # Link the Scala.js smoke test to a single main.js, then run it under Node.
    - id: org.codehaus.mojo:exec-maven-plugin:3.5.0
      executions:
        - id: link-smoke
          phase: test
          goals: ['exec']
          configuration:
            executable: java
            arguments:
              - -jar
              - ${project.basedir}/../src/build/sjsld/target/sjsld.jar
              - ${project.build.directory}/scalajs-smoke
              - io.github.jam01.json_schema.Smoke
              - ${project.build.outputDirectory}
              - ${project.build.testOutputDirectory}
              - '@${project.build.directory}/test-classpath.txt'
        - id: run-smoke
          phase: test
          goals: ['exec']
          configuration:
            executable: node
            arguments:
              - ${project.build.directory}/scalajs-smoke/main.js
